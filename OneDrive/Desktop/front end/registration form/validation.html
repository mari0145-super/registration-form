<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 1: Registration Form</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
            font-size: 14px;
        }

        input {
            padding: 10px 14px;
            border: 1.5px solid #dcdfe6;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #3498db;
        }

        input.error-border {
            border-color: #e74c3c;
        }

        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2980b9;
        }

        .success-banner {
            display: none;
            background-color: #2ecc71;
            color: white;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Registration Form</h2>
        <div id="successBanner" class="success-banner">Form submitted successfully!</div>
        
        <form id="registrationForm" novalidate>
            <!-- Name Field -->
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
                <span class="error-message" id="nameError">Name is required.</span>
            </div>

            <!-- Email Field -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="example@domain.com">
                <span class="error-message" id="emailError">Please enter a valid email address.</span>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 8 characters">
                <span class="error-message" id="passwordError">Password must be at least 8 characters.</span>
            </div>

            <!-- Confirm Password Field -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter your password">
                <span class="error-message" id="confirmPasswordError">Passwords do not match.</span>
            </div>

            <!-- Age Field -->
            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" placeholder="Enter your age">
                <span class="error-message" id="ageError">Age must be a valid number (18-120).</span>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const ageInput = document.getElementById('age');
        const successBanner = document.getElementById('successBanner');

        // Helper function to show error
        function showError(input, errorElement, message) {
            input.classList.add('error-border');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        // Helper function to clear error
        function clearError(input, errorElement) {
            input.classList.remove('error-border');
            errorElement.style.display = 'none';
        }

        // Validation Functions
        function validateName() {
            const val = nameInput.value.trim();
            if (val === '') {
                showError(nameInput, document.getElementById('nameError'), 'Name is required.');
                return false;
            }
            clearError(nameInput, document.getElementById('nameError'));
            return true;
        }

        function validateEmail() {
            const val = emailInput.value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (val === '') {
                showError(emailInput, document.getElementById('emailError'), 'Email is required.');
                return false;
            } else if (!emailRegex.test(val)) {
                showError(emailInput, document.getElementById('emailError'), 'Please enter a valid email address.');
                return false;
            }
            clearError(emailInput, document.getElementById('emailError'));
            return true;
        }

        function validatePassword() {
            const val = passwordInput.value;
            if (val.length < 8) {
                showError(passwordInput, document.getElementById('passwordError'), 'Password must be at least 8 characters.');
                return false;
            }
            clearError(passwordInput, document.getElementById('passwordError'));
            return true;
        }

        function validateConfirmPassword() {
            const val = confirmPasswordInput.value;
            const passVal = passwordInput.value;
            if (val === '') {
                showError(confirmPasswordInput, document.getElementById('confirmPasswordError'), 'Please confirm your password.');
                return false;
            } else if (val !== passVal) {
                showError(confirmPasswordInput, document.getElementById('confirmPasswordError'), 'Passwords do not match.');
                return false;
            }
            clearError(confirmPasswordInput, document.getElementById('confirmPasswordError'));
            return true;
        }

        function validateAge() {
            const val = parseInt(ageInput.value, 10);
            if (isNaN(val) || val < 18 || val > 120) {
                showError(ageInput, document.getElementById('ageError'), 'Age must be between 18 and 120.');
                return false;
            }
            clearError(ageInput, document.getElementById('ageError'));
            return true;
        }

        // Event Listeners for Real-time Feedback
        nameInput.addEventListener('input', validateName);
        emailInput.addEventListener('input', validateEmail);
        passwordInput.addEventListener('input', validatePassword);
        confirmPasswordInput.addEventListener('input', validateConfirmPassword);
        ageInput.addEventListener('input', validateAge);

        // Form Submit Validation
        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form submission

            const isNameValid = validateName();
            const isEmailValid = validateEmail();
            const isPasswordValid = validatePassword();
            const isConfirmValid = validateConfirmPassword();
            const isAgeValid = validateAge();

            if (isNameValid && isEmailValid && isPasswordValid && isConfirmValid && isAgeValid) {
                successBanner.style.display = 'block';
                form.reset();
                setTimeout(() => {
                    successBanner.style.display = 'none';
                }, 4000);
            } else {
                successBanner.style.display = 'none';
            }
        });
    </script>

</body>
</html>
